name: deploy-site

# Builds site/ with Mizzen and the Lateen theme, writes the sitemap index and robots.txt over the output, and deploys
# the root of https://velella.sh. Each project publishes below its own path from its own repository.
# Pages' source must be set to "GitHub Actions". Pull requests only build and check the site.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SITE: site
  SITE_URL: ${{ vars.SITE_URL || 'https://velella.sh' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install the site tools
        run: |
          mkdir "$RUNNER_TEMP/site-tools"
          cd "$RUNNER_TEMP/site-tools"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact @velella/mizzen@0.2.7 @velella/lateen@0.2.5
      - name: Check the site
        run: |
          BIN="$RUNNER_TEMP/site-tools/node_modules/.bin/mizzen"
          THEME="$RUNNER_TEMP/site-tools/node_modules/@velella/lateen"
          "$BIN" doctor "$SITE" --theme "$THEME"
          "$BIN" check "$SITE" --theme "$THEME"
      - name: Build the root site
        run: |
          BIN="$RUNNER_TEMP/site-tools/node_modules/.bin/mizzen"
          THEME="$RUNNER_TEMP/site-tools/node_modules/@velella/lateen"
          "$BIN" build "$SITE" --theme "$THEME" --out "$RUNNER_TEMP/dist"
      - name: Write the sitemap index and robots.txt
        run: |
          "$RUNNER_TEMP/site-tools/node_modules/.bin/mizzen" network sitemap "$SITE" --url "$SITE_URL" --out "$RUNNER_TEMP/dist"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/dist
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
